services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: profnavigator
      POSTGRES_PASSWORD: profnavigator
      POSTGRES_DB: profnavigator
    ports:
      - "55432:5432"
    volumes:
      - profnavigator-db-data:/var/lib/postgresql/data

  storage:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: profnavigator
      MINIO_ROOT_PASSWORD: profnavigator123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - profnavigator-storage-data:/data

volumes:
  profnavigator-db-data:
  profnavigator-storage-data:
